name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching pom.xml, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify release version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $expectedTag = "v$($pom.project.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG must match pom.xml version $expectedTag."
          }

      - name: Build Maven Package
        run: mvn clean package -DskipTests

      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -Directory |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $wix) { throw "WiX Toolset 3 was not found after installation." }
          $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows EXE
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1 -Type exe

      - name: Sign Windows EXE
        if: ${{ env.SIGNING_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "bizora-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $installer = Get-ChildItem target\installer\*.exe | Select-Object -First 1
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "SignTool was not found." }
          & $signTool.FullName sign /fd SHA256 /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          Remove-Item $certificate -Force
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" |
            Set-Content "target\installer\$($installer.Name).sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            target/installer/*.exe
            target/installer/*.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify release version
        run: |
          version="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Release tag $RELEASE_TAG must match pom.xml version v$version."
            exit 1
          }

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Build DEB and RPM installers
        run: xvfb-run --auto-servernum ./packaging/linux/build-installers.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            target/installer/*.deb
            target/installer/*.rpm
            target/installer/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "Bizora ${RELEASE_TAG#v}" \
              --generate-notes \
              --notes "Self-contained installers for Windows 10/11, Ubuntu/Debian, and Fedora/RHEL. The Windows installer is unsigned unless the release workflow has signing secrets configured."
          fi
