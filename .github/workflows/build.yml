name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and test
        run: xvfb-run --auto-servernum ./mvnw --batch-mode clean test

      - name: Build runtime image
        run: ./mvnw --batch-mode -DskipTests javafx:jlink
