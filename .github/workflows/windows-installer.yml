name: Build Windows MSIX Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MSIX_PACKAGE_NAME: ${{ secrets.MSIX_PACKAGE_NAME }}
      MSIX_PUBLISHER_ID: ${{ secrets.MSIX_PUBLISHER_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Maven Package
        run: mvn clean package -DskipTests

      - name: Build MSIX package
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1 -Type msix

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: Bizora-MSIX
          path: |
            target/installer/*.msix
            target/installer/*.sha256
          if-no-files-found: error
          retention-days: 30

